<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F5EEDF">
<title>مزاين الحلال</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap">
<style>
:root{--ink:#4A2E1A;--gold:#B8862E;--burg:#7B2333;--green:#2F5D3A;--sand:#F5EEDF;--paper:#FBF7EE;--line:#E4D9C4;--muted:#6B5A45;--teal:#13857F}
*{box-sizing:border-box}
body{margin:0;background:#E9E0CC;font-family:'Almarai',system-ui,sans-serif;font-size:16px;color:var(--ink)}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--sand);display:flex;flex-direction:column}
h1,h2{font-weight:800;line-height:1.3}
button,input,select,textarea{font:inherit}
.top{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 18px 18px}
.top.dark{background:var(--ink);color:var(--sand);border:0}
.logo{display:block;width:130px;height:auto;margin:0 auto}
.search{margin-top:12px;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:0 14px;height:48px}
.search input{flex:1;border:0;background:transparent;font-size:15px;color:var(--ink);outline:none;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 18px 0;scrollbar-width:none}
.chip{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid #B8A88E;background:transparent;color:var(--ink);font-size:14px;cursor:pointer}
.chip.on{background:var(--ink);color:var(--sand);border-color:var(--ink)}
main{flex:1;padding:18px 18px 100px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.title{font-size:20px;font-weight:800;margin:0}
.muted{color:var(--muted);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.ok{background:#E3EDE5;color:var(--green)}
.warn{background:#F3E6CF;color:var(--burg)}
.off{background:#EEE7DA;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;background:#FBF3E2;border:1px solid #E6D3AE;border-radius:12px;padding:12px}
.stats small{display:block;font-size:12px;color:var(--burg);font-weight:700}
.stats b{font-size:15px}
.btn{min-height:46px;border-radius:12px;border:0;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;font-weight:700;text-decoration:none;cursor:pointer;width:100%;padding:0 12px}
.btn:disabled{opacity:.5;cursor:default}
.btn-dark{background:var(--ink);color:var(--sand)}
.btn-line{background:transparent;border:1.5px solid var(--ink);color:var(--ink)}
.btn-gold{background:var(--gold);color:var(--ink);font-weight:800;min-height:52px;font-size:16px}
.btn-reg{background:#E9DCC2;color:var(--ink);border:2px solid var(--teal);min-height:52px;font-size:16px;font-weight:800}
.btn-red{background:transparent;border:1.5px solid var(--burg);color:var(--burg)}
.btn-sm{min-height:38px;font-size:13px;width:auto;padding:0 14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700}
.f input,.f select,.f textarea{height:48px;border-radius:12px;border:1px solid #D9CDB6;background:#fff;padding:0 12px;font-size:15px;font-weight:400;color:var(--ink);width:100%}
.f textarea{height:auto;padding:10px 12px;resize:vertical}
.back{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid #D9CDB6;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dark .back{border-color:#7A5A40}
.head{display:flex;align-items:center;gap:12px}
.head h1{margin:0;font-size:24px}
.item{background:#fff;border:1px solid #E6D3AE;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.item img,.photo{width:100%;max-height:240px;object-fit:cover;border-radius:10px;display:block}
.rank{width:40px;height:40px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800}
.price-card{background:var(--ink);color:var(--sand);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:12px}
.check{display:flex;align-items:center;gap:10px;font-size:15px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:6px 4px calc(10px + env(safe-area-inset-bottom));z-index:5}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a.on{color:var(--burg);font-weight:800}
nav.tabs a.on svg{stroke:var(--burg)}
.empty{text-align:center;color:var(--muted);padding:24px 8px;font-size:14px}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sand);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.show{opacity:1}
.seg{display:flex;flex-wrap:wrap;gap:8px}
a.link{color:var(--burg);font-weight:700;font-size:14px}
.notice{background:#F3E6CF;color:var(--burg);font-size:13px;padding:10px 14px;border-radius:12px;line-height:1.7}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.loading{display:flex;align-items:center;justify-content:center;min-height:60vh;color:var(--muted)}
</style>
</head>
<body>
<div class="app">
  <div id="view" style="flex:1;display:flex;flex-direction:column"><div class="loading">جاري التحميل…</div></div>
  <nav class="tabs" aria-label="التنقل الرئيسي" id="tabs"></nav>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ===================== ثوابت ===================== */
const LOCAL_SHEEP=['الحري','النجدي','النعيمي','الرفيدي'];
const LOCAL_GOATS=['العارضية','البيشية','الحجازية','الحبشية','الزميرية','المحايلية','المصرية'];
const IMPORTED=['السواكني','الصومالي','الاسترالي','الروماني','الميدي'];
const BREEDS=[...LOCAL_SHEEP,...IMPORTED];
const nb=s=>String(s||'').trim().replace(/^ال/,'');
const sameBreed=(a,b)=>nb(a)===nb(b);
function adBreeds(animal,origin){if(origin==='مستورد')return IMPORTED;if(origin==='محلي')return animal==='ماعز'?LOCAL_GOATS:LOCAL_SHEEP;return animal==='ماعز'?[...LOCAL_GOATS,...IMPORTED]:animal==='غنم'?[...LOCAL_SHEEP,...IMPORTED]:[...LOCAL_SHEEP,...LOCAL_GOATS,...IMPORTED]}
const TYPES=['طليان','رخال','نعاج','فحل'];
const AGES=['جذع','ثني','رباع','سديس'];
const ANIMALS=['غنم','ماعز'];
const ORIGINS=['محلي','مستورد'];
const AD_TYPES=['ذكور','إناث','مختلط','فحل','مواليد'];
const AD_DAYS=30;
const CFG_BANK=window.BANK||{};
const NOT_SET='يُحدد لاحقاً';
const isPlaceholder=v=>!v||/اسم البنك|اسم صاحب|SA00 0000/.test(v);
function bank(){const s=S.settings||{};return{name:s.bankName||(isPlaceholder(CFG_BANK.name)?'':CFG_BANK.name)||NOT_SET,holder:s.holder||(isPlaceholder(CFG_BANK.holder)?'':CFG_BANK.holder)||NOT_SET,iban:s.iban||(isPlaceholder(CFG_BANK.iban)?'':CFG_BANK.iban)||NOT_SET}}
function adPrice(){return Number((S.settings&&S.settings.adPrice)||window.AD_PRICE||33)}
function price(){return Number((S.settings&&S.settings.price)||window.SUB_PRICE||99)}
const ic=(d,c='#6B5A45',s=22,w=1.8)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={store:'<path d="M3 9l1.5-5h15L21 9"/><path d="M4 9v11h16V9"/><path d="M3 9h18"/><path d="M9 20v-6h6v6"/>',plus:'<path d="M12 5v14M5 12h14"/>',home:'<path d="M3 10.5 12 3l9 7.5V21H3z"/>',marah:'<path d="M3 21V9l9-5 9 5v12"/><path d="M3 15h18"/>',cup:'<path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/>',list:'<path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',back:'<path d="m9 18 6-6-6-6"/>',check:'<path d="M20 6 9 17l-5-5"/>',pin:'<path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/>',search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',wa:'<path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 21l2.1-5.5A8.4 8.4 0 1 1 21 11.5z"/>',phone:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,sel)=>a.map(x=>`<option ${x===sel?'selected':''}>${x}</option>`).join('');
const money=p=>p?`${Number(p).toLocaleString('ar-SA')} ر.س`:'على السوم';
function waNum(p){let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('05'))d='966'+d.slice(1);else if(d.startsWith('5')&&d.length===9)d='966'+d;return d}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}
function go(h){location.hash=h}
function backBtn(dark){return `<button class="back" aria-label="رجوع" onclick="history.length>1?history.back():go('home')">${ic(I.back,dark?'#F5EEDF':'#4A2E1A',20,2)}</button>`}
function compress(file,max=900,q=.62){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);let out=c.toDataURL('image/jpeg',q);if(out.length>700000)out=c.toDataURL('image/jpeg',.4);res(out)};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}

/* ===================== Firebase ===================== */
const CFG=window.FIREBASE_CONFIG||{};
const READY=!!(CFG.apiKey&&CFG.projectId);
let auth,db;
const S={user:null,isAdmin:false,myMarah:null,marahs:[],items:[],requests:[],allMarahs:[],receipts:[],settings:{},ads:[],mkKind:'الكل',mkBreed:'الكل',mkAnimal:'الكل',mkOrigin:'الكل',mkQ:'',filter:'الكل',q:'',loaded:false};
const now=()=>Date.now();
const isLive=m=>m&&m.active&&(!m.activeUntil||m.activeUntil>now());

if(READY){
  firebase.initializeApp(CFG);
  auth=firebase.auth();db=firebase.firestore();
  auth.getRedirectResult().catch(()=>{});
  db.collection('marahs').where('active','==',true).onSnapshot(s=>{S.marahs=s.docs.map(d=>({id:d.id,...d.data()})).filter(isLive);S.loaded=true;render()},e=>{console.log(e);S.loaded=true;render()});
  db.collection('items').orderBy('createdAt','desc').limit(500).onSnapshot(s=>{S.items=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.log(e));
  db.collection('ads').orderBy('createdAt','desc').limit(300).onSnapshot(s=>{S.ads=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.log(e));
  db.collection('settings').doc('app').onSnapshot(d=>{S.settings=d.exists?d.data():{};render()},e=>console.log(e));
  db.collection('requests').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{S.requests=s.docs.map(d=>({id:d.id,...d.data()}));render()},e=>console.log(e));
  let unsubMine=null,unsubAdmin=[];
  auth.onAuthStateChanged(async u=>{
    S.user=u;S.isAdmin=false;S.myMarah=null;
    if(unsubMine){unsubMine();unsubMine=null}
    unsubAdmin.forEach(f=>f());unsubAdmin=[];
    if(u){
      unsubMine=db.collection('marahs').doc(u.uid).onSnapshot(d=>{S.myMarah=d.exists?{id:d.id,...d.data()}:null;render()});
      try{const a=await db.collection('admins').doc(u.uid).get();S.isAdmin=a.exists}catch(e){}
      if(S.isAdmin){
        unsubAdmin.push(db.collection('marahs').onSnapshot(s=>{S.allMarahs=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
        unsubAdmin.push(db.collection('receipts').orderBy('createdAt','desc').limit(100).onSnapshot(s=>{S.receipts=s.docs.map(d=>({id:d.id,...d.data()}));render()}));
      }
    }
    render();
  });
}
async function signIn(){
  const p=new firebase.auth.GoogleAuthProvider();
  try{await auth.signInWithPopup(p)}catch(e){if(e.code==='auth/popup-blocked'||e.code==='auth/operation-not-supported-in-this-environment'||e.code==='auth/cancelled-popup-request'){await auth.signInWithRedirect(p)}else if(e.code!=='auth/popup-closed-by-user'){toast('تعذّر الدخول: '+(e.code||''))}}
}
function signOut(){auth.signOut();go('home')}
const itemsOf=id=>S.items.filter(i=>i.marahId===id);

/* ===================== الواجهات ===================== */
function tabs(active){
  const t=[['home','الرئيسية',I.home],['marahs','الصنف',I.marah],['mazayen','المزاين',I.cup],['market','السوق',I.store],['account','حسابي',I.user]];
  document.getElementById('tabs').innerHTML=t.map(([h,l,d])=>`<a href="#${h}" class="${active===h?'on':''}">${ic(d)}${l}</a>`).join('');
}
function verifiedBadge(m){return m.verified?`<span class="badge ok">${ic(I.check,'#2F5D3A',14,2.4)}موثّق</span>`:''}
function contactBtns(m){
  const n=waNum(m.phone);
  if(!n)return '';
  return `<div class="grid2"><a class="btn btn-line" href="https://wa.me/${n}" target="_blank" rel="noopener">${ic(I.wa,'#4A2E1A',18)}واتساب</a><a class="btn btn-line" href="tel:+${n}">${ic(I.phone,'#4A2E1A',18)}اتصال</a></div>`;
}
function marahCard(m){
  const its=itemsOf(m.id).filter(i=>i.status!=='مباع');
  const shown=S.filter==='الكل'?its:its.filter(i=>sameBreed(i.breed,S.filter));
  const first=shown[0]||its[0];
  const n=waNum(m.phone);
  return `<div class="card">
    <div class="row" style="align-items:flex-start"><div><h2 class="title">${esc(m.name)}</h2><div class="muted">المالك: ${esc(m.ownerName)}</div></div>${verifiedBadge(m)}</div>
    <div class="muted" style="display:flex;align-items:center;gap:6px;font-size:13px">${ic(I.pin,'#6B5A45',16)}${esc(m.region||'—')}</div>
    ${first?`<div class="stats"><div><small>الصنف</small><b>${esc(first.breed)}</b></div><div><small>العدد</small><b>${first.count||'—'}</b></div><div><small>السعر</small><b>${money(first.price)}</b></div></div>`:'<div class="muted">ما أضاف حلال للحين</div>'}
    <div class="grid2"><a class="btn btn-line" href="#marah-${m.id}">صفحة المراح</a>${n?`<a class="btn btn-line" href="https://wa.me/${n}" target="_blank" rel="noopener">${ic(I.wa,'#4A2E1A',18)}واتساب</a>`:''}</div>
  </div>`;
}
function filtered(){
  const q=S.q.trim();
  return S.marahs.filter(m=>{
    const its=itemsOf(m.id);
    const okF=S.filter==='الكل'||its.some(i=>sameBreed(i.breed,S.filter)&&i.status!=='مباع');
    const okQ=!q||[m.name,m.ownerName,m.region,...its.map(i=>i.breed+' '+i.type)].join(' ').includes(q);
    return okF&&okQ;
  }).sort((a,b)=>(b.verified?1:0)-(a.verified?1:0)||(b.awards||0)-(a.awards||0));
}
function viewHome(){
  const list=filtered();
  return `<div class="top"><img class="logo" src="logo.png" alt="مزاين الحلال">
  <label class="search">${ic(I.search,'#6B5A45',20)}<span class="sr">بحث</span><input id="q" type="search" placeholder="ابحث عن مراح أو صنف أو منطقة" value="${esc(S.q)}"></label></div>
  <div class="chips">${['الكل',...BREEDS].map(b=>`<button class="chip ${S.filter===b?'on':''}" data-b="${b}">${b}</button>`).join('')}</div>
  <main><div class="grid2">
  <a href="#marahs" class="card" style="text-decoration:none;color:inherit;align-items:center;text-align:center;gap:6px;background:var(--ink);border:0">${ic(I.marah,'#E8C77E',30)}<b style="color:var(--sand);font-size:16px">الصنف والمزاين</b><span style="color:#D9CDB6;font-size:12px">المرحان الموثّقة</span></a>
  <a href="#market" class="card" style="text-decoration:none;color:inherit;align-items:center;text-align:center;gap:6px;background:#E9DCC2;border:2px solid var(--teal)">${ic(I.store,'#4A2E1A',30)}<b style="font-size:16px">سوق الحلال</b><span class="muted" style="font-size:12px">بيع وشراء — غنم وماعز</span></a></div>
  <div class="row"><h2 class="title" style="font-size:22px">المرحان</h2><a class="link" href="#marahs">عرض الكل</a></div>
  ${!S.loaded?'<div class="empty">جاري التحميل…</div>':list.length?list.map(marahCard).join(''):'<div class="empty">ما فيه مرحان بهذا البحث حالياً</div>'}
  <a class="btn btn-reg" href="#account">سجّل مراحك — ${price()} ريال شهرياً</a></main>`;
}
function viewMarahs(){
  return `<div class="top"><div class="head"><h1>الصنف والمزاين</h1></div><div class="muted" style="margin-top:6px">المرحان المشتركة وحلالها المميز</div></div>
  <main>${S.marahs.length?S.marahs.map(marahCard).join(''):'<div class="empty">ما فيه مرحان للحين</div>'}<a class="btn btn-reg" href="#account">سجّل مراحك</a></main>`;
}
function itemBlock(i,owner){
  const sold=i.status==='مباع';
  return `<div class="item">${i.photo?`<img src="${i.photo}" alt="${esc(i.breed)}">`:''}
  <div class="row"><b style="font-size:17px">${esc(i.breed)} — ${esc(i.type)} ${esc(i.age)}</b><span class="badge ${sold?'off':i.price?'ok':'warn'}">${sold?'مباع':i.price?'متوفر':'على السوم'}</span></div>
  <div class="muted" style="display:flex;gap:16px;flex-wrap:wrap"><span>العدد: ${i.count||'—'}</span><span>السعر: ${i.price?money(i.price)+' للرأس':'على السوم'}</span></div>
  ${i.note?`<div class="muted">${esc(i.note)}</div>`:''}
  ${owner?`<div class="seg"><button class="btn btn-line btn-sm" onclick="toggleSold('${i.id}','${sold?'متوفر':'مباع'}')">${sold?'رجّعه متوفر':'علّمه مباع'}</button><button class="btn btn-red btn-sm" onclick="delItem('${i.id}')">حذف</button></div>`:''}</div>`;
}
function viewMarah(id){
  const m=S.marahs.find(x=>x.id===id)||(S.myMarah&&S.myMarah.id===id?S.myMarah:null);
  if(!m)return `<main><div class="head">${backBtn()}<h1>المراح</h1></div><div class="empty">${S.loaded?'المراح غير موجود أو اشتراكه غير مفعّل':'جاري التحميل…'}</div></main>`;
  const its=itemsOf(m.id);
  const total=its.filter(i=>i.status!=='مباع').reduce((a,i)=>a+(Number(i.count)||0),0);

  const live=isLive(S.myMarah);
  const form=S.user?`<form id="reqForm" class="card"><b>أضف طلب شراء</b>
  <div class="grid2"><label class="f">الصنف<select name="breed">${opts(BREEDS)}</select></label><label class="f">النوع<select name="type">${opts(TYPES)}</select></label>
  <label class="f">العدد<input name="count" type="number" min="1" inputmode="numeric" placeholder="مثال: 20" required></label><label class="f">المدينة<input name="city" placeholder="مثال: الرياض" required></label></div>
  <label class="f">جوالك للتواصل<input name="phone" inputmode="tel" placeholder="05xxxxxxxx" required></label>
  <button class="btn btn-gold">نشر الطلب</button></form>`:`<div class="card"><b>تبغى تشتري؟</b><div class="muted">سجّل دخولك وانشر طلبك، والمرحان تتواصل معك.</div><button class="btn btn-dark" onclick="signIn()">الدخول بحساب Google</button></div>`;
  return `<div class="top dark"><h1 style="margin:0;font-size:28px">طلبات الشراء</h1><div style="color:#D9CDB6;margin-top:4px">المشتري يطلب، والمرحان ترد</div></div>
  <main>${form}
  ${S.requests.length?S.requests.map(r=>{const mine=S.user&&S.user.uid===r.uid;const n=waNum(r.phone);return `<div class="item"><div class="row"><b style="font-size:17px">مطلوب ${esc(r.count)} رأس ${esc(r.breed)}</b><span class="muted" style="font-size:12px">${r.createdAt?new Date(r.createdAt).toLocaleDateString('ar-SA'):''}</span></div>
  <div class="seg" style="font-size:13px"><span class="badge off">${esc(r.city)}</span><span class="badge off">${esc(r.type)}</span></div>
  ${live&&n&&!mine?`<a class="btn btn-line" target="_blank" rel="noopener" href="https://wa.me/${n}?text=${encodeURIComponent('السلام عليكم، بخصوص طلبك في مزاين الحلال: '+r.count+' رأس '+r.breed+' — عندي المطلوب في '+S.myMarah.name)}">عندي المطلوب — رد بالواتساب</a>`:''}
  ${mine||S.isAdmin?`<button class="btn btn-red btn-sm" style="align-self:flex-start" onclick="delReq('${r.id}')">حذف الطلب</button>`:''}</div>`}).join(''):'<div class="empty">ما فيه طلبات للحين</div>'}
  <div class="muted" style="font-size:13px">الرد على الطلبات متاح للمرحان المشتركة فقط.</div></main>`;
}
function viewAdmin(){
  if(!S.isAdmin)return `<main><div class="empty">هذي الصفحة للإدارة فقط</div></main>`;
  const newR=S.receipts.filter(r=>r.status!=='done');
  const st=S.settings||{};const b=bank();
  return `<main><div class="head">${backBtn()}<h1>لوحة الإدارة</h1></div>
  <form id="settingsForm" class="card"><b>الاشتراك والحساب البنكي</b>
  <label class="f">قيمة الاشتراك الشهري (ريال)<input name="price" type="number" min="1" inputmode="numeric" value="${price()}" required></label>
  <label class="f">رسوم إعلان السوق (ريال)<input name="adPrice" type="number" min="1" inputmode="numeric" value="${adPrice()}" required></label>
  <label class="f">اسم البنك<input name="bankName" placeholder="مثال: مصرف الراجحي" value="${esc(b.name===NOT_SET?'':b.name)}"></label>
  <label class="f">اسم صاحب الحساب<input name="holder" placeholder="الاسم كما في البنك" value="${esc(b.holder===NOT_SET?'':b.holder)}"></label>
  <label class="f">رقم الآيبان<input name="iban" dir="ltr" placeholder="SA.." value="${esc(b.iban===NOT_SET?'':b.iban)}"></label>
  <button class="btn btn-dark">حفظ</button></form>
  <h2 class="title">إيصالات بانتظار المراجعة (${newR.length})</h2>
  ${newR.length?newR.map(r=>`<div class="item"><b>${esc(r.marahName)}</b><div class="muted">${r.createdAt?new Date(r.createdAt).toLocaleString('ar-SA'):''}</div><img src="${r.image}" alt="إيصال">
  <div class="grid2">${r.adId?`<button class="btn btn-dark" onclick="approveAd('${r.id}','${r.adId}')">نشر الإعلان</button>`:`<button class="btn btn-dark" onclick="approve('${r.id}','${r.uid}')">تفعيل اشتراك شهر</button>`}<button class="btn btn-red" onclick="rejectR('${r.id}')">رفض</button></div></div>`).join(''):'<div class="empty">ما فيه إيصالات جديدة</div>'}
  <h2 class="title">كل المرحان (${S.allMarahs.length})</h2>
  ${S.allMarahs.map(m=>{const live=isLive(m);return `<div class="item"><div class="row"><b>${esc(m.name)}</b>${live?'<span class="badge ok">مفعّل</span>':'<span class="badge off">غير مفعّل</span>'}</div>
  <div class="muted">${esc(m.ownerName)} — ${esc(m.region)} — <span style="direction:ltr">${esc(m.phone)}</span></div>
  ${m.activeUntil?`<div class="muted">ينتهي: ${new Date(m.activeUntil).toLocaleDateString('ar-SA')}</div>`:''}
  <div class="seg">
  <button class="btn btn-line btn-sm" onclick="setLive('${m.id}',${!live})">${live?'إيقاف':'تفعيل شهر'}</button>
  <button class="btn btn-line btn-sm" onclick="setField('${m.id}','verified',${!m.verified})">${m.verified?'إلغاء التوثيق':'توثيق'}</button>
  <button class="btn btn-line btn-sm" onclick="addAward('${m.id}',1)">+ نقطة</button>
  <button class="btn btn-line btn-sm" onclick="addAward('${m.id}',-1)">− نقطة</button>
  <span class="muted" style="align-self:center">النقاط: ${m.awards||0}</span></div></div>`}).join('')}</main>`;
}
function viewSetup(){
  return `<main style="padding-top:28px"><img class="logo" src="logo.png" alt="مزاين الحلال"><div class="card"><b>باقي خطوة وحدة</b><div class="muted" style="line-height:1.8">افتح ملف <b>firebase-config.js</b> في المستودع، والصق فيه إعدادات مشروعك من Firebase، وبعدها حدّث الصفحة.</div></div></main>`;
}

/* ===================== التوجيه ===================== */
function render(){
  const v=document.getElementById('view');
  if(!READY){v.innerHTML=viewSetup();document.getElementById('tabs').innerHTML='';return}
  const h=(location.hash||'#home').slice(1);
  let html,tab='home';
  if(h.startsWith('marah-')){html=viewMarah(h.slice(6));tab='marahs'}
  else if(h==='marahs'){html=viewMarahs();tab='marahs'}
  else if(h==='add'){html=viewAdd();tab='account'}
  else if(h==='subscribe'){html=viewSubscribe();tab='account'}
  else if(h==='mazayen'){html=viewMazayen();tab='mazayen'}
  else if(h==='requests'||h==='market'){html=viewMarket();tab='market'}
  else if(h==='newad'){html=viewNewAd();tab='market'}
  else if(h==='myads'){html=viewMyAds();tab='market'}
  else if(h.startsWith('payad-')){html=viewPayAd(h.slice(6));tab='market'}
  else if(h==='oldrequests'){html=viewRequests();tab='market'}
  else if(h==='account'){html=viewAccount();tab='account'}
  else if(h==='admin'){html=viewAdmin();tab='account'}
  else html=viewHome();
  // لا نعيد الرسم أثناء الكتابة في نموذج
  const ae=document.activeElement;
  if(ae&&['INPUT','TEXTAREA','SELECT'].includes(ae.tagName)&&ae.type!=='file'&&v.contains(ae)&&ae.id!=='q'&&v._h===h)return;
  v._h=h;v.innerHTML=html;tabs(tab);bind();
}
window.addEventListener('hashchange',()=>{const v=document.getElementById('view');v._h=null;render();window.scrollTo(0,0)});

/* ===================== الأحداث ===================== */
function bind(){
  const q=document.getElementById('q');
  if(q)q.addEventListener('input',e=>{S.q=e.target.value;const p=e.target.selectionStart;document.getElementById('view')._h=null;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)});
  document.querySelectorAll('.chips .chip').forEach(b=>b.onclick=()=>{S.filter=b.dataset.b;document.getElementById('view')._h=null;render()});
  const seg=document.getElementById('breedSeg');
  if(seg)seg.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{seg.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  const lb=document.getElementById('locBtn');
  if(lb)lb.onclick=()=>{const fm=lb.closest('form');const msg=fm.querySelector('#locMsg');
    if(!navigator.geolocation){msg.textContent='جهازك ما يدعم تحديد الموقع';return}
    msg.textContent='جاري تحديد الموقع…';
    navigator.geolocation.getCurrentPosition(p=>{const la=p.coords.latitude.toFixed(6),ln=p.coords.longitude.toFixed(6);
      fm.lat.value=la;fm.lng.value=ln;fm.mapUrl.value=`https://www.google.com/maps?q=${la},${ln}`;msg.textContent='تم تحديد الموقع ✓ — لا تنسى تحفظ';},
      e=>{msg.textContent=e.code===1?'رفضت إذن الموقع. فعّله من إعدادات المتصفح وجرّب مرة ثانية':'تعذّر تحديد الموقع، جرّب مرة ثانية'},{enableHighAccuracy:true,timeout:15000})};
  const mf=document.getElementById('marahForm');
  if(mf)mf.onsubmit=async e=>{e.preventDefault();const f=new FormData(mf);const btn=mf.querySelector('button');btn.disabled=true;
    const data={name:f.get('name').trim(),ownerName:f.get('ownerName').trim(),region:f.get('region').trim(),phone:f.get('phone').trim(),mapUrl:(f.get('mapUrl')||'').trim(),lat:f.get('lat')?Number(f.get('lat')):null,lng:f.get('lng')?Number(f.get('lng')):null};
    if(data.mapUrl&&!/^https:\/\/(www\.)?(google\.[a-z.]+\/maps|maps\.google\.[a-z.]+|maps\.app\.goo\.gl|goo\.gl\/maps)/.test(data.mapUrl)){toast('الرابط لازم يكون من خرائط Google');btn.disabled=false;return}
    try{const ref=db.collection('marahs').doc(S.user.uid);
      if(S.myMarah){await ref.update(data);toast('انحفظت التعديلات')}
      else{await ref.set({...data,active:false,verified:false,awards:0,activeUntil:0,createdAt:now()});toast('انسجل مراحك — الخطوة الجاية الاشتراك');go('subscribe')}
    }catch(err){toast('صار خطأ: '+(err.code||err.message))}btn.disabled=false};
  const af=document.getElementById('addForm');
  if(af)af.onsubmit=async e=>{e.preventDefault();const f=new FormData(af);const btn=af.querySelector('button[type=submit],button:not([type])');btn.disabled=true;btn.textContent='جاري النشر…';
    try{let photo='';const file=f.get('photo');if(file&&file.size)photo=await compress(file,700,.55);
      await db.collection('items').add({marahId:S.user.uid,breed:seg.querySelector('.on').dataset.v,type:f.get('type'),age:f.get('age'),count:f.get('count')?Number(f.get('count')):null,price:f.get('price')?Number(f.get('price')):null,note:(f.get('note')||'').trim(),photo,status:'متوفر',createdAt:now()});
      toast('انضاف الحلال لمراحك');go('marah-'+S.user.uid)}catch(err){toast('صار خطأ: '+(err.code||err.message));btn.disabled=false;btn.textContent='نشر في مراحي'}};
  document.querySelectorAll('.chip.mk').forEach(b=>b.onclick=()=>{S[b.dataset.k]=b.dataset.v;if(b.dataset.k!=='mkBreed'&&b.dataset.k!=='mkKind')S.mkBreed='الكل';document.getElementById('view')._h=null;render()});
  const mq=document.getElementById('mkq');
  if(mq)mq.addEventListener('input',e=>{S.mkQ=e.target.value;const p=e.target.selectionStart;document.getElementById('view')._h=null;render();const n=document.getElementById('mkq');n.focus();n.setSelectionRange(p,p)});
  const aa=document.getElementById('adAnimal');
  const ao=document.getElementById('adOrigin');
  const fillBreeds=()=>{const ab=document.getElementById('adBreed');ab.innerHTML=opts(adBreeds(aa.value,ao.value))};
  if(aa){aa.onchange=()=>{S.adAnimal=aa.value;fillBreeds()};ao.onchange=()=>{S.adOrigin=ao.value;fillBreeds()}}
  const adf=document.getElementById('adForm');
  if(adf)adf.onsubmit=async e=>{e.preventDefault();const f=new FormData(adf);const btn=adf.querySelector('button:not([type])');btn.disabled=true;btn.textContent='جاري النشر…';
    try{let photo='';const file=f.get('photo');if(file&&file.size)photo=await compress(file,700,.55);
      const ref=await db.collection('ads').add({uid:S.user.uid,kind:f.get('kind'),animal:f.get('animal'),origin:f.get('origin'),breed:(f.get('breed')||'').trim(),type:f.get('type'),age:f.get('age')||'',count:Number(f.get('count')),price:f.get('price')?Number(f.get('price')):null,city:f.get('city').trim(),phone:f.get('phone').trim(),note:(f.get('note')||'').trim(),photo,status:'pending',receiptSent:false,createdAt:now(),expiresAt:0});
      toast('انحفظ إعلانك — باقي الدفع');go('payad-'+ref.id)}catch(err){toast('صار خطأ: '+(err.code||err.message));btn.disabled=false;btn.textContent='التالي: الدفع'}};
  const rf=document.getElementById('reqForm');
  if(rf)rf.onsubmit=async e=>{e.preventDefault();const f=new FormData(rf);const btn=rf.querySelector('button');btn.disabled=true;
    try{await db.collection('requests').add({uid:S.user.uid,breed:f.get('breed'),type:f.get('type'),count:Number(f.get('count')),city:f.get('city').trim(),phone:f.get('phone').trim(),createdAt:now()});rf.reset();toast('انتشر طلبك')}catch(err){toast('صار خطأ: '+(err.code||err.message))}btn.disabled=false};
  const sf=document.getElementById('settingsForm');
  if(sf)sf.onsubmit=async e=>{e.preventDefault();const f=new FormData(sf);const btn=sf.querySelector('button');btn.disabled=true;
    try{await db.collection('settings').doc('app').set({price:Number(f.get('price'))||99,adPrice:Number(f.get('adPrice'))||33,bankName:f.get('bankName').trim(),holder:f.get('holder').trim(),iban:f.get('iban').trim()},{merge:true});toast('انحفظت الإعدادات')}catch(err){toast('صار خطأ: '+(err.code||err.message))}btn.disabled=false};
  const ar=document.getElementById('adReceipt');
  if(ar)ar.onchange=async()=>{if(!ar.files.length)return;toast('جاري رفع الإيصال…');const id=ar.dataset.ad;const a=S.ads.find(x=>x.id===id);
    try{const image=await compress(ar.files[0],1200,.6);await db.collection('receipts').add({uid:S.user.uid,adId:id,kindOf:'ad',marahName:'إعلان: '+(a.kind==='بيع'?'للبيع ':'للشراء ')+a.count+' '+a.animal+' '+(a.breed||'')+' — '+a.city,image,status:'new',createdAt:now()});
      await db.collection('ads').doc(id).update({receiptSent:true});toast('استلمنا الإيصال — ينشر الإعلان بعد المراجعة')}catch(err){toast('صار خطأ: '+(err.code||err.message))}};
  const rc=document.getElementById('receipt');
  if(rc)rc.onchange=async()=>{if(!rc.files.length)return;toast('جاري رفع الإيصال…');
    try{const image=await compress(rc.files[0],1200,.6);await db.collection('receipts').add({uid:S.user.uid,marahName:S.myMarah.name,image,status:'new',createdAt:now()});toast('استلمنا الإيصال — يتفعّل اشتراكك بعد المراجعة')}catch(err){toast('صار خطأ: '+(err.code||err.message))}};
}
async function toggleSold(id,st){try{await db.collection('items').doc(id).update({status:st})}catch(e){toast('صار خطأ')}}
async function delItem(id){if(!confirm('تحذف هذا الحلال؟'))return;try{await db.collection('items').doc(id).delete();toast('انحذف')}catch(e){toast('صار خطأ')}}
async function delAd(id){if(!confirm('تحذف الإعلان؟'))return;try{await db.collection('ads').doc(id).delete();toast('انحذف الإعلان')}catch(e){toast('صار خطأ')}}
async function approveAd(rid,adId){const a=S.ads.find(x=>x.id===adId)||{};const base=Math.max(now(),a.status==='active'?(a.expiresAt||0):0);
  try{await db.collection('ads').doc(adId).update({status:'active',receiptSent:false,expiresAt:base+AD_DAYS*86400000});await db.collection('receipts').doc(rid).update({status:'done'});toast('انتشر الإعلان 30 يوم')}catch(e){toast('صار خطأ')}}
async function delReq(id){if(!confirm('تحذف الطلب؟'))return;try{await db.collection('requests').doc(id).delete();toast('انحذف الطلب')}catch(e){toast('صار خطأ')}}
function copyIban(){navigator.clipboard.writeText(String(bank().iban===NOT_SET?'':bank().iban).replace(/\s/g,'')).then(()=>toast('انسخ الآيبان'),()=>toast('ما قدرت أنسخ'))}
const MONTH=30*24*3600*1000;
async function setLive(uid,on){const m=S.allMarahs.find(x=>x.id===uid)||{};const base=Math.max(now(),m.activeUntil||0);try{await db.collection('marahs').doc(uid).update(on?{active:true,activeUntil:base+MONTH}:{active:false});toast(on?'تفعّل الاشتراك شهر':'توقف الاشتراك')}catch(e){toast('صار خطأ')}}
async function setField(uid,k,v){try{await db.collection('marahs').doc(uid).update({[k]:v})}catch(e){toast('صار خطأ')}}
async function addAward(uid,d){const m=S.allMarahs.find(x=>x.id===uid)||{};try{await db.collection('marahs').doc(uid).update({awards:Math.max(0,(m.awards||0)+d)})}catch(e){toast('صار خطأ')}}
async function approve(rid,uid){await setLive(uid,true);try{await db.collection('receipts').doc(rid).update({status:'done'})}catch(e){}}
async function rejectR(rid){if(!confirm('ترفض الإيصال؟'))return;try{await db.collection('receipts').doc(rid).update({status:'done',rejected:true})}catch(e){toast('صار خطأ')}}

render();
</script>
</body>
</html>
